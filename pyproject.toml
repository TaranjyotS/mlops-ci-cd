[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-ci-cd"
version = "0.2.0"
description = "Production-style CI/CD workflows for MLOps: data validation, model training, drift monitoring, registry, and FastAPI deployment."
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Taranjyot Singh"}]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".dvc", "data", "models", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-q --cov=mlops_ci_cd --cov-report=term-missing"
